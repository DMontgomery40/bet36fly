[project]
name = "bet36fly"
version = "0.1.0"
description = "A real MaleCNS connectome network for paper sports prediction"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3", "scipy>=1.14,<2", "pandas>=2.2,<3", "pyarrow>=19,<22",
  "torch>=2.6,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "scikit-learn>=1.6,<2", "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
